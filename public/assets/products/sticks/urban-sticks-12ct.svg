<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920">
  <defs>
    <linearGradient id="stickMatte" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="stickShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g transform="translate(60,60)" filter="url(#stickShadow)">
    <rect x="0" y="0" width="640" height="820" rx="48" fill="url(#stickMatte)"/>
    <rect x="62" y="150" width="516" height="210" rx="22" fill="#0c0c0c" stroke="#191919"/>
    <image href="../../logo.png" x="96" y="170" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
    <text x="220" y="232" font-family="Montserrat, Arial, sans-serif" font-size="30" fill="#F6EFE7" font-weight="700">Urban Sticks</text>
    <text x="220" y="260" font-family="Inter, Arial, sans-serif" font-size="13" fill="#cbbfa6">12 Pack • Coffee Sticks</text>
    <text x="96" y="328" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8dccb">Ultra-fine single-serve sachets, premium instant ritual.</text>
    <g transform="translate(96, 430)">
      <rect x="0" y="0" width="520" height="210" rx="18" fill="#0b0b0b" stroke="#212121"/>
      <text x="260" y="40" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d4a36b" text-anchor="middle">12 CT</text>
      <text x="260" y="72" font-family="Inter, Arial, sans-serif" font-size="12" fill="#e8dccb" text-anchor="middle">Premium stick sachets for travel and ritual</text>
    </g>
  </g>
</svg>
