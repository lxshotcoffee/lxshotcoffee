<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080">
  <defs>
    <linearGradient id="emberMatte" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <filter id="emberShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.56"/>
    </filter>
  </defs>
  <g transform="translate(60,70)" filter="url(#emberShadow)">
    <rect x="0" y="0" width="640" height="920" rx="48" fill="url(#emberMatte)"/>
    <rect x="48" y="180" width="544" height="388" rx="22" fill="#090909" stroke="#1f1f1f"/>
    <image href="../../logo.png" x="84" y="220" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
    <text x="240" y="276" font-family="Montserrat, Arial, sans-serif" font-size="32" fill="#F6EFE7" font-weight="700">Ember Ground</text>
    <text x="240" y="310" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbbfa6">Colombia • 200g • Ground Coffee</text>
    <text x="84" y="360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e8dccb">Velvety body, toasted hazelnut, and warm autumn spice.</text>
    <rect x="84" y="448" width="132" height="42" rx="10" fill="#0e0e0e" stroke="#242424"/>
    <text x="150" y="476" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d4a36b" text-anchor="middle">200G</text>
  </g>
</svg>
