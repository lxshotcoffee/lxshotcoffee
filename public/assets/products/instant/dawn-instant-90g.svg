<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920">
  <defs>
    <linearGradient id="instantMatte" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <filter id="instantShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
  <g transform="translate(60,60)" filter="url(#instantShadow)">
    <rect x="0" y="0" width="600" height="800" rx="40" fill="url(#instantMatte)"/>
    <rect x="68" y="160" width="464" height="260" rx="20" fill="#0c0c0c" stroke="#181818"/>
    <rect x="80" y="230" width="120" height="120" rx="20" fill="#121212"/>
    <image href="../../logo.png" x="92" y="242" width="96" height="96" preserveAspectRatio="xMidYMid meet"/>
    <text x="220" y="248" font-family="Montserrat, Arial, sans-serif" font-size="28" fill="#F6EFE7" font-weight="700">Dawn Instant</text>
    <text x="220" y="280" font-family="Inter, Arial, sans-serif" font-size="12" fill="#cbbfa6">Instant Coffee • 90g</text>
    <text x="80" y="360" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e8dccb">Silky clarity, bright citrus, crafted for instant ritual.</text>
    <rect x="80" y="472" width="450" height="200" rx="18" fill="#0b0b0b" stroke="#222"/>
    <text x="100" y="520" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d4a36b">Premium freeze-dried instant coffee for elevated moments.</text>
  </g>
</svg>
