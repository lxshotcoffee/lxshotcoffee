<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920">
  <defs>
    <linearGradient id="nightMatte" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="nightShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.58"/>
    </filter>
  </defs>
  <g transform="translate(65,60)" filter="url(#nightShadow)">
    <rect x="0" y="0" width="590" height="810" rx="44" fill="url(#nightMatte)"/>
    <rect x="66" y="160" width="458" height="260" rx="22" fill="#090909" stroke="#151515"/>
    <image href="../../logo.png" x="96" y="220" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
    <text x="220" y="304" font-family="Montserrat, Arial, sans-serif" font-size="30" fill="#F6EFE7" font-weight="700">Nightcap Instant</text>
    <text x="220" y="334" font-family="Inter, Arial, sans-serif" font-size="12" fill="#cbbfa6">Instant Coffee • 90g</text>
    <text x="96" y="394" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8dccb">Deep cocoa, hazelnut, and evening comfort in a luxe sachet.</text>
    <rect x="96" y="494" width="154" height="44" rx="10" fill="#0f0f0f" stroke="#232323"/>
    <text x="173" y="523" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d4a36b" text-anchor="middle">90G</text>
  </g>
</svg>
