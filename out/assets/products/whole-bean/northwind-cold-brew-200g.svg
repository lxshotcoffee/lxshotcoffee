<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100">
  <defs>
    <linearGradient id="matte3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="sdrop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="34" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(60,60)" filter="url(#sdrop)">
    <rect x="0" y="0" width="640" height="980" rx="52" fill="url(#matte3)"/>
    <rect x="72" y="220" width="496" height="360" rx="16" fill="#0b0b0b" stroke="#1b1b1b"/>
    <image href="/lxshotcoffee/assets/logo.png" x="96" y="240" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>
    <text x="240" y="280" font-family="Montserrat, Arial, sans-serif" font-size="34" fill="#F6EFE7" font-weight="700">Northwind Cold Brew</text>
    <text x="240" y="320" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbbfa6">Brazil • 200g • Whole Bean</text>
    <text x="96" y="360" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e8dccb">Bold, low-acid roast crafted for slow extraction and cold steeping</text>
    <rect x="96" y="520" width="100" height="38" rx="8" fill="#0f0f0f" stroke="#232323"/>
    <text x="146" y="546" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d4a36b" text-anchor="middle">200G</text>
  </g>
